name: Dev build

# Ручной запуск: вкладка Actions -> Dev build -> Run workflow (результат — в Artifacts)
# Или тег вида dev-1.0.1 — тогда .exe попадут в предварительный релиз (pre-release)
on:
  push:
    tags: ['dev-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Dev installer and portable exe
        run: npm run dist:dev
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-dev/*.exe
          prerelease: true
          generate_release_notes: true
      - name: Keep build as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: FluentCraft-Launcher-Dev-windows
          path: dist-dev/*.exe
