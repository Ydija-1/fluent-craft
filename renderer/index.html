<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'">
  <title>FluentCraft Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar">
    <svg class="tb-logo" viewBox="0 0 16 16" aria-hidden="true">
      <rect x="1" y="1" width="6" height="6" rx="1.2" fill="var(--accent)"/>
      <rect x="9" y="1" width="6" height="6" rx="1.2" fill="var(--accent)" opacity=".55"/>
      <rect x="1" y="9" width="6" height="6" rx="1.2" fill="var(--accent)" opacity=".55"/>
      <rect x="9" y="9" width="6" height="6" rx="1.2" fill="var(--accent)" opacity=".8"/>
    </svg>
    <span>FluentCraft Launcher</span>
  </div>

  <div class="shell">
    <nav id="nav" aria-label="Разделы"></nav>
    <main id="main"><div id="view"></div></main>
  </div>

  <div id="tasks" class="tasks" hidden></div>
  <div id="toasts" class="toasts"></div>
  <div id="dialogs"></div>

  <script src="errors.js"></script>
  <script src="icons.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
